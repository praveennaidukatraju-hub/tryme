name: tryme

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tryme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tryon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tryon_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-tryon_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tryon} -d ${POSTGRES_DB:-tryon_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tryme-net

  redis:
    image: redis:7-alpine
    container_name: tryme-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tryme-net

  minio:
    image: minio/minio:latest
    container_name: tryme-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_pw}
    ports:
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tryme-net

  minio-bootstrap:
    image: minio/mc:latest
    container_name: tryme-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    # Per-bucket CORS-XML (`mc cors set`) is dead on current MinIO server
    # versions — returns an empty body instead of the XML the older mc client
    # expects ("decoding xml: EOF"), silently no-op'ing every start. The
    # server-wide `api cors_allow_origin` config is what actually serves CORS.
    # `mc anonymous set download` mirrors the public-read R2 bucket used in
    # prod — StorageProvider.publicUrl() builds a direct (non-presigned) GET
    # URL, so a private local bucket 404s/403s every thumbnail in the admin
    # and catalogues-web UIs.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_dev_pw} &&
      mc mb --ignore-existing local/${R2_BUCKET:-virtual-tryon-dev} &&
      mc anonymous set download local/${R2_BUCKET:-virtual-tryon-dev} &&
      mc admin config set local api cors_allow_origin='*' &&
      mc admin service restart local &&
      echo 'minio bucket ready: ${R2_BUCKET:-virtual-tryon-dev}'
      "
    networks:
      - tryme-net

  # ── Containerized apps (profile: apps) ──────────────────────────────────────
  # Run api + dispatcher as containers so Alloy's Docker log discovery captures
  # their stdout (host-run `pnpm dev` processes are invisible to Alloy). They reuse
  # the local infra above by service name, and read the dev root .env — the three
  # host-only URLs are overridden here to container hostnames, and NODE_ENV=production
  # forces JSON log output so Alloy can parse level/jobId/userId.
  #
  #   docker compose -f infra/docker-compose.yml --profile apps --profile observability up -d --build
  #
  # Stop `pnpm dev` first to avoid confusion (containers and host apps are separate).
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: tryme-api
    restart: unless-stopped
    profiles: ["apps"]
    volumes:
      - ../.env:/app/.env:ro
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-tryon}:${POSTGRES_PASSWORD:-tryon_dev_pw}@postgres:5432/${POSTGRES_DB:-tryon_dev}
      REDIS_URL: redis://redis:6379
      R2_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tryme-net

  dispatcher:
    build:
      context: ..
      dockerfile: apps/dispatcher/Dockerfile
    container_name: tryme-dispatcher
    restart: unless-stopped
    profiles: ["apps"]
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-tryon}:${POSTGRES_PASSWORD:-tryon_dev_pw}@postgres:5432/${POSTGRES_DB:-tryon_dev}
      REDIS_URL: redis://redis:6379
      R2_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tryme-net

  # Local observability agent (profile: observability) — tails container logs → Loki
  # and scrapes api/dispatcher /metrics → Prometheus, both to Grafana Cloud. Requires
  # GRAFANA_CLOUD_* vars in the root .env. Run together with the `apps` profile so the
  # apps are containers Alloy can both scrape (api:4000) and log-discover.
  alloy:
    image: grafana/alloy:latest
    container_name: tryme-alloy
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # Defaults (api:4000 / dispatcher:4100) match the containerized apps above.
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    networks:
      - tryme-net

volumes:
  pgdata:
  redisdata:
  miniodata:
  alloydata:

networks:
  tryme-net:
    driver: bridge
