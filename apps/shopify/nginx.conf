# Assumes the outer edge (whatever proxies admin.tryme.com) strips the
# /shopify-admin prefix before forwarding here — i.e. a
# `location /shopify-admin/ { proxy_pass http://shopify-admin:80/; }` style rule
# (trailing slash on both sides = strip). This container never sees that prefix;
# Vite's build already bakes /shopify-admin/ into index.html's asset URLs, and
# the browser re-requests those against the edge, which strips + forwards again.

# Long-cache a hashed asset only when we actually served it. nginx's `expires`
# and bare `add_header` already skip non-2xx/3xx, so an error response left this
# block carrying no Cache-Control at all — and "no directive" is an invitation,
# not a prohibition: Cloudflare negative-caches a bare 404 for minutes on its
# own defaults, then the browser stores that from-edge 404 in disk cache and
# stops asking anyone. On a content-addressed path a 404 always means a broken
# deploy or a misconfigured proxy prefix, so the fix ships and the stale 404
# outlives it. `no-store` on every non-200 keeps an error uncacheable at both
# layers. This is defence in depth, not the primary control — the edge decides
# its own negative-caching, so staging also carries a Cloudflare cache rule.
map $status $asset_cache_control {
    200     "public, max-age=31536000, immutable";
    default "no-store";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Required for embedded Shopify apps: without it, Shopify's app review
    # flags the app for not restricting who can iframe it, and browsers apply
    # no framing restriction at all. A location block that sets its own
    # add_header stops inheriting this from the server block (nginx
    # semantics), so it's repeated in each location below rather than set
    # once here.
    set $csp "frame-ancestors https://*.myshopify.com https://admin.shopify.com;";

    # All paths fall back to index.html (SPA — client-side routing).
    # index.html itself must never be cached: it references the current
    # content-hashed JS/CSS bundle, and this SPA is reloaded into a fresh
    # iframe every time a merchant navigates from a native Shopify admin
    # page (Products, Customers, ...) back into the app. Without an explicit
    # no-cache here, the browser's heuristic caching can keep serving a
    # stale index.html (and therefore a stale, possibly pre-fix JS bundle)
    # indefinitely after a deploy, until something forces revalidation.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
    }

    # Cache static assets aggressively (Vite hashes filenames) — but only on a
    # 200; see the $asset_cache_control map above for why errors must be
    # explicitly uncacheable rather than merely header-less.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control $asset_cache_control always;
        add_header Content-Security-Policy $csp always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
