# Long-cache a hashed asset only when we actually served it. nginx's `expires`
# and bare `add_header` already skip non-2xx/3xx, so an error response left this
# block carrying no Cache-Control at all — and "no directive" is an invitation,
# not a prohibition: Cloudflare negative-caches a bare 404 for minutes on its
# own defaults, then the browser stores that from-edge 404 in disk cache and
# stops asking anyone. On a content-addressed path a 404 always means a broken
# deploy or a misconfigured proxy prefix, so the fix ships and the stale 404
# outlives it. `no-store` on every non-200 keeps an error uncacheable at both
# layers. Mirrors apps/shopify/nginx.conf.
map $status $asset_cache_control {
    200     "public, max-age=31536000, immutable";
    default "no-store";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # All paths fall back to index.html (SPA — state-based routing, no URL routes).
    # index.html itself must never be cached: it names the current content-hashed
    # bundle, so a cached copy pins the browser to a stale bundle. Without an
    # explicit no-cache, Last-Modified/ETag alone are enough for heuristic
    # caching to serve it straight from disk with no request at all — the bug
    # fixed for the Shopify SPA in 5157d0b0, which never propagated here.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets aggressively (Vite hashes filenames) — but only on a
    # 200; see the $asset_cache_control map above.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control $asset_cache_control always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
